name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests & parcours
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Tests API
        run: python -m pytest -q

      - name: Vérifier les 30 missions de bout en bout
        run: python scripts/selfcheck_curriculum.py

  frontend:
    name: Frontend · lint, build & fumée UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shellforge-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/shellforge-app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de production
        run: npm run build

      - name: Installer le backend pour le test de fumée
        working-directory: .
        run: pip install -r requirements.txt

      - name: Démarrer l'API
        working-directory: .
        run: |
          python -m uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Fumée UI (jsdom, 5 écrans)
        run: npm run test:ui

      - name: Arrêter l'API
        if: always()
        run: pkill -f "uvicorn main:app" || true
